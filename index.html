<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript - Arrays and Functions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Array Operations</h1>
    <p class="subtitle">Find the maximum, sum, and count of odd numbers in an array.</p>

    <div class="array-display">
      <span class="label">Test Array:</span>
      <span id="arrayValue" class="array-value"></span>
    </div>

    <button id="runBtn" class="run-btn">Run Operations</button>

    <ul class="results">
      <li>Maximum number: <span id="maxResult">-</span></li>
      <li>Sum of all elements: <span id="sumResult">-</span></li>
      <li>Count of odd numbers: <span id="oddResult">-</span></li>
    </ul>

    <p class="hint">Open the browser console (F12) to see the same results logged there.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
